services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: tickets

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54329}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "tickets", "-d", "tickets"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
  api:
    build:
      context: ./server
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: tickets
      POSTGRES_DB: tickets
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
    - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: